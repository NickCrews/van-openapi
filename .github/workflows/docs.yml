name: Publish docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first run so no manual settings step is needed
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # openapi.json in docs/ is a symlink to the spec; the artifact tar
          # dereferences it, so the deployed site gets a real copy
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
